# Newly authored confirmatory material for the social-connection family.

loneliness:
  no_confidant:
    - {domain: personal, context: "I received news that will change several important plans.", high: "There is nobody I can speak to honestly about what it means for me.", low: "There is one person I can call and tell everything without holding back.", closing: "I have not discussed the news yet."}
    - {domain: public, context: "A difficult disagreement arose during my volunteer placement.", high: "I cannot think of anyone with whom I could privately share what happened.", low: "I have a close friend with whom I can privately share what happened.", closing: "The placement continues next week."}
    - {domain: consumer, context: "A financial decision has been weighing on me since I left the bank.", high: "I have no person I can turn to for a personal and candid conversation.", low: "I have a close person I can turn to for a personal and candid conversation.", closing: "The paperwork is due next month."}
    - {domain: work, context: "I am unsure how to respond to a sensitive change in my role.", high: "No one in my life is available for the kind of private conversation I need.", low: "Someone close to me is available for the kind of private conversation I need.", closing: "I need not decide today."}
    - {domain: personal, context: "I have been carrying a family concern that I do not want to discuss publicly.", high: "There is not a single person to whom I can reveal how I really feel about it.", low: "There is a person to whom I can reveal exactly how I really feel about it.", closing: "The concern has lasted several days."}
    - {domain: public, context: "Something unsettling happened while I was helping at a local event.", high: "I have nobody with whom I can process the experience in confidence.", low: "I have someone with whom I can process the experience in confidence.", closing: "The event itself has finished."}
  excluded:
    - {domain: public, context: "The members of my neighbourhood project arranged a planning dinner.", high: "Everyone on the project received an invitation except me.", low: "I received the same invitation as every other member of the project.", closing: "The dinner concerns our shared work."}
    - {domain: consumer, context: "A bookshop organised a private evening for members of its reading programme.", high: "The other members were included, while my name alone was removed from the list.", low: "My name appeared on the list alongside all the other members.", closing: "My membership is current."}
    - {domain: work, context: "My department formed a group to discuss the next project cycle.", high: "They invited every person at my level but deliberately left me out.", low: "They invited me together with every other person at my level.", closing: "The meeting takes place during normal hours."}
    - {domain: personal, context: "My extended family planned a weekend gathering in a shared message group.", high: "They included every nearby relative except me.", low: "They included me in the same way as every nearby relative.", closing: "I learned about the plan before the weekend."}
    - {domain: public, context: "The regular players at the recreation centre chose teams for a local tournament.", high: "They registered all the regular players apart from me.", low: "They registered me along with all the regular players.", closing: "There was room for everyone."}
    - {domain: consumer, context: "A cooking course offered returning participants an optional final session.", high: "The organiser contacted every returning participant except me.", low: "The organiser contacted me along with every returning participant.", closing: "The session had enough places."}
  unseen:
    - {domain: work, context: "I explained to my team why a recent change has been difficult for me.", high: "Their replies showed that none of them understood what I was trying to express.", low: "Their replies showed that they understood exactly what I was trying to express.", closing: "The discussion lasted half an hour."}
    - {domain: personal, context: "I described an important experience to people I have known for years.", high: "Although they listened, I felt emotionally separate and unknown to them.", low: "As they listened, I felt understood and emotionally close to them.", closing: "We remained in the same room afterwards."}
    - {domain: public, context: "I spoke during a support meeting about what daily life has been like.", high: "The responses left me feeling that nobody there could see the person behind my words.", low: "The responses left me feeling that the people there could see the person behind my words.", closing: "The meeting followed its normal schedule."}
    - {domain: consumer, context: "I tried to explain a personal concern during an advisory appointment.", high: "The conversation left me feeling invisible and emotionally cut off from the adviser.", low: "The conversation left me feeling recognised and emotionally understood by the adviser.", closing: "The practical advice was identical."}
    - {domain: work, context: "I shared the reasons behind a decision with my long-term collaborators.", high: "They reacted as though the things that mattered to me were completely foreign to them.", low: "They reacted with a clear understanding of the things that mattered to me.", closing: "No decision was changed."}
    - {domain: personal, context: "I talked with relatives about a change in how I see my future.", high: "I came away feeling emotionally distant, as if they did not know me at all.", low: "I came away feeling emotionally close, as if they knew me deeply.", closing: "The visit lasted the same amount of time."}

isolation:
  small_network:
    - {domain: consumer, context: "A membership form asked me to list people I regularly know outside the service.", high: "Only one name could be entered because there is almost nobody in my personal network.", low: "I could list many friends and relatives from different parts of my life.", closing: "The form did not ask how I feel about them."}
    - {domain: work, context: "I mapped the people with whom I have an ongoing relationship outside routine transactions.", high: "The map contained only one continuing social tie.", low: "The map contained dozens of continuing ties across friends, relatives, and colleagues.", closing: "Frequency of contact was recorded separately."}
    - {domain: personal, context: "I updated the emergency and personal contacts stored in my phone.", high: "Apart from one distant relative, there was nobody I could list as part of my life.", low: "I listed a broad circle of friends and relatives who are part of my life.", closing: "The entries were current."}
    - {domain: public, context: "A community survey counted the people each resident knows personally.", high: "My count was one person in total.", low: "My count included many people from family, friendship, and local networks.", closing: "The survey did not ask about emotional closeness."}
    - {domain: consumer, context: "An insurance interview asked about my continuing personal connections.", high: "I could identify just one person with whom I have an ongoing tie.", low: "I identified a large set of people with whom I have ongoing ties.", closing: "The policy decision did not depend on the answer."}
    - {domain: work, context: "For a relocation exercise, I listed everyone who remains part of my social network.", high: "The list ended after a single name.", low: "The list covered many friends, relatives, and former colleagues.", closing: "The exercise counted ties rather than their quality."}
  rare_contact:
    - {domain: work, context: "I reviewed my calendar to count direct conversations with other people.", high: "Most months pass without a single conversation, message, or visit.", low: "Every day includes several conversations, messages, or visits.", closing: "The count covers both work and private life."}
    - {domain: personal, context: "My communication log covers the past twelve weeks.", high: "It shows only one interaction with another person during that entire period.", low: "It shows interactions with other people on every day of the period.", closing: "Automated notifications were excluded."}
    - {domain: public, context: "A health survey asked how often I speak or meet with anyone.", high: "I reported that this happens less than once a month.", low: "I reported that this happens many times each day.", closing: "The question did not ask whether I enjoyed it."}
    - {domain: consumer, context: "My phone and visit diary provide a record of actual social interaction.", high: "Across six weeks, there was one brief exchange with another person.", low: "Across six weeks, there were multiple exchanges on every day.", closing: "Customer-service messages were not counted."}
    - {domain: work, context: "The remote-working review counted contact rather than task completion.", high: "Weeks routinely go by without my speaking or writing to another person.", low: "I speak or write with several people throughout every working day and weekend.", closing: "The arrangement has lasted a year."}
    - {domain: personal, context: "I kept a simple tally of calls, messages, and face-to-face meetings.", high: "The tally is usually empty for an entire month.", low: "The tally contains several entries on every day.", closing: "It records occurrence, not emotional meaning."}
  low_participation:
    - {domain: personal, context: "I reviewed my involvement in organised activities over the last year.", high: "I did not attend any club, association, faith group, class, or community event.", low: "I attended several clubs, associations, classes, and community events every week.", closing: "Informal solitary hobbies were not counted."}
    - {domain: public, context: "The town survey asked residents about participation in local organisations.", high: "I reported no meetings, groups, events, or organised activities of any kind.", low: "I reported regular weekly participation in several local organisations and events.", closing: "The survey covered twelve months."}
    - {domain: consumer, context: "A recreation-centre review examined use of organised group programmes.", high: "I had joined none and attended no group sessions.", low: "I was enrolled in several programmes and attended group sessions each week.", closing: "Individual exercise was recorded elsewhere."}
    - {domain: work, context: "An employee survey counted voluntary participation beyond assigned tasks.", high: "I took part in no committees, networks, clubs, or shared events.", low: "I took part in several committees, networks, clubs, and shared events each month.", closing: "Performance at assigned work was not included."}
    - {domain: personal, context: "I listed every organised activity in which I took part this season.", high: "The list was empty: there were no group or community activities.", low: "The list included recurring groups and community activities on several days each week.", closing: "The season lasted three months."}
    - {domain: public, context: "A library questionnaire asked about participation in its community programmes.", high: "I attended none of the groups, workshops, or public sessions.", low: "I attended multiple groups, workshops, and public sessions each week.", closing: "Borrowing books alone did not count."}

belonging:
  accepted:
    - {domain: public, context: "I joined a neighbourhood team that had worked together for several years.", high: "They welcomed my contribution and repeatedly showed that they valued having me among them.", low: "They rejected my contribution and repeatedly showed that they did not want me among them.", closing: "The team met for its usual length of time."}
    - {domain: consumer, context: "I attended the first meeting of a long-running craft circle.", high: "The members included me in their plans and treated my presence as worthwhile.", low: "The members shut me out of their plans and treated my presence as unwanted.", closing: "My skill level was the same in both versions."}
    - {domain: work, context: "I transferred into an established project group.", high: "The group made room for my views and made clear that I was a valued member.", low: "The group dismissed my views and made clear that I was not wanted as a member.", closing: "My formal role was unchanged."}
    - {domain: personal, context: "I began spending time with my partner's close group of friends.", high: "They openly welcomed me and treated me as someone whose presence mattered.", low: "They openly rejected me and treated me as someone whose presence was a burden.", closing: "We attended the same number of gatherings."}
    - {domain: public, context: "I volunteered with a team preparing a local exhibition.", high: "The others sought my input and expressed that they were glad I had joined them.", low: "The others refused my input and expressed that they wished I had not joined them.", closing: "The assigned work was identical."}
    - {domain: consumer, context: "I entered a regular discussion group run by a local shop.", high: "Its members received me warmly and showed that they valued my place in the group.", low: "Its members received me coldly and showed that they rejected my place in the group.", closing: "The session covered the same topic."}
  fits_in:
    - {domain: work, context: "I spent a week with a new unit whose members share established ways of working.", high: "Their habits and references felt natural to me, and I felt like one of them.", low: "Their habits and references felt foreign to me, and I felt like the odd person out.", closing: "They behaved politely in both cases."}
    - {domain: personal, context: "I attended several gatherings with a group connected to my new hobby.", high: "I felt in step with the group and experienced myself as part of its 'we.'", low: "I felt out of step with the group and experienced myself as an outsider to its 'we.'", closing: "The number of gatherings was the same."}
    - {domain: public, context: "I participated in a resident committee with a strong shared identity.", high: "The group's customs and outlook felt like mine, so I felt that I fit naturally.", low: "The group's customs and outlook felt unlike mine, so I felt that I did not fit there.", closing: "I retained the same voting rights."}
    - {domain: consumer, context: "I joined a travel group whose members already knew one another.", high: "Within the group I felt at home and saw myself as one of its members.", low: "Within the group I felt out of place and saw myself as separate from its members.", closing: "The itinerary was identical."}
    - {domain: work, context: "I began a placement in a team with its own routines and humour.", high: "I understood the unspoken patterns and felt that this was my kind of group.", low: "I could not connect with the unspoken patterns and felt unlike everyone there.", closing: "The team gave me the same tasks."}
    - {domain: personal, context: "I took part in a family tradition with relatives I had recently met.", high: "The shared practices felt natural, and I experienced myself as part of the family circle.", low: "The shared practices felt alien, and I experienced myself as outside the family circle.", closing: "Everyone stayed for the same amount of time."}
  lasting_bonds:
    - {domain: personal, context: "I considered the close relationships that have shaped my adult life.", high: "The same caring people have remained reliably connected to me through many years.", low: "Each close relationship has repeatedly broken down after a short time.", closing: "The number of people initially met was comparable."}
    - {domain: public, context: "A long-term community project brought several of us into contact.", high: "Those connections grew into dependable, caring relationships that have endured for years.", low: "Those connections repeatedly dissolved, leaving no continuing relationship after each season.", closing: "The project itself continued."}
    - {domain: consumer, context: "A cooperative programme introduced me to people with similar interests.", high: "We built caring ties that remained steady through changes and disagreements.", low: "Any ties we formed collapsed whenever circumstances changed or disagreements appeared.", closing: "The programme lasted the same length of time."}
    - {domain: work, context: "I looked back at relationships formed across several workplaces.", high: "A core group has continued to care for one another and stay connected over many years.", low: "Every promising connection faded or ended as soon as a job changed.", closing: "The career history is otherwise the same."}
    - {domain: personal, context: "I reflected on the people I once considered close companions.", high: "Our care for one another has been stable, and the relationships have survived difficult periods.", low: "The relationships have been unstable, repeatedly ending when any difficulty arose.", closing: "The difficult periods were comparable."}
    - {domain: public, context: "I met a group while working on recurring local events.", high: "Over time we formed dependable relationships that continue with mutual care.", low: "Over time our connections kept falling apart and never became lasting relationships.", closing: "The events occurred at the same frequency."}
