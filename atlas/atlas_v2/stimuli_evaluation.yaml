# Newly authored confirmatory material for the evaluation family.

satisfaction:
  quality:
    - {domain: consumer, context: "I hired a company to digitise a box of old photographs.", high: "Every scan was sharp, correctly cropped, and accurately coloured.", low: "Every scan was blurred, badly cropped, and discoloured.", closing: "The agreed price and delivery date were unchanged."}
    - {domain: work, context: "Our office installed software for transcribing recorded meetings.", high: "It captured the speakers and technical terms accurately throughout.", low: "It confused the speakers and mistranscribed technical terms throughout.", closing: "The licence and setup process were identical."}
    - {domain: personal, context: "I used a bicycle repair service before a long journey.", high: "The repaired gears shifted smoothly and the brakes worked precisely.", low: "The repaired gears slipped constantly and the brakes barely responded.", closing: "The same parts and turnaround time were listed."}
    - {domain: public, context: "The local archive produced a copy of a historical map for me.", high: "The copy was complete, legible, and faithful to the original scale.", low: "The copy omitted sections, was illegible, and distorted the original scale.", closing: "The request and fee were the same."}
    - {domain: consumer, context: "I bought a portable recorder for field interviews.", high: "It produced clear sound and operated reliably for the stated battery life.", low: "It produced distorted sound and repeatedly stopped far before the stated battery life.", closing: "Its appearance and price were unchanged."}
    - {domain: work, context: "A contractor prepared the figures for our annual report.", high: "The figures were accurate, readable, and delivered in the required formats.", low: "The figures contained errors, were hard to read, and used unusable formats.", closing: "The brief and deadline were identical."}
  exceeded_expectations:
    - {domain: work, context: "The analysis arrived with ten variables, correct numerical results, and a clear two-page summary.", high: "Before ordering it, I had expected only a raw table with a few brief notes.", low: "Before ordering it, I had expected a full diagnostic report with detailed recommendations.", closing: "The delivered analysis was identical in both accounts."}
    - {domain: personal, context: "The room was clean and quiet and had a desk, a window, and a basic breakfast.", high: "Before the stay, I had expected a cramped room with more noise and no usable workspace.", low: "Before the stay, I had expected a large premium room with a full breakfast and extra facilities.", closing: "The room and service received were identical in both accounts."}
    - {domain: public, context: "The workshop delivered three clear lectures and one useful guided exercise.", high: "I had expected a superficial talk with no chance to practise anything.", low: "I had expected advanced individual coaching and several practical sessions.", closing: "The speakers, materials, and delivered programme were identical."}
    - {domain: consumer, context: "The coat had the described material and lining, fitted normally, and was comfortable for an ordinary day.", high: "Before wearing it, I had expected stiff fabric, awkward movement, and little comfort.", low: "Before wearing it, I had expected exceptional tailoring and all-day comfort beyond an ordinary coat.", closing: "The garment received was identical in both accounts."}
    - {domain: work, context: "The course covered every listed module and gave a useful introduction through standard exercises.", high: "Before it began, I had expected little more than copies of the presentation slides.", low: "Before it began, I had expected advanced practice tailored to my own projects.", closing: "The content, fee, and schedule were identical in both accounts."}
    - {domain: personal, context: "The exhibition contained every advertised display and held my attention for about two hours.", high: "Before visiting, I had expected a short and rather dull walk through familiar material.", low: "Before visiting, I had expected an exceptional, immersive experience that would occupy most of the day.", closing: "The exhibition and visit were identical in both accounts."}
  value_for_money:
    - {domain: personal, context: "I paid 120 francs for a weekend photography class with the stated instruction and practice.", high: "Comparable local classes with the same hours and content cost between 240 and 300 francs.", low: "Comparable local classes with the same hours and content cost between 40 and 60 francs.", closing: "The class itself and my available budget were the same."}
    - {domain: public, context: "The annual pass for the municipal pool cost 300 francs and provided the stated access and facilities.", high: "Buying the same visits separately at that pool would have cost about 750 francs.", low: "A nearby public pool offered the same visits and facilities for 120 francs.", closing: "My use of the pass was otherwise identical."}
    - {domain: consumer, context: "A kitchen mixer cost 240 francs, included the listed attachments, and worked as described.", high: "Other shops charged about 480 francs for the same model and attachments.", low: "Other shops routinely sold the same model and attachments for about 90 francs.", closing: "No discount, refund, or product difference was involved."}
    - {domain: work, context: "Our team paid 1,200 francs for a year of a document-search service with the stated functions.", high: "The nearest service with the same functions and limits cost more than 4,000 francs a year.", low: "Several services with the same functions and limits cost about 250 francs a year.", closing: "The contract and our use of the service were identical."}
    - {domain: personal, context: "I paid 600 francs for a six-session language package with the advertised lesson length and content.", high: "Equivalent six-session packages in the same area cost between 1,100 and 1,300 francs.", low: "Equivalent six-session packages in the same area cost between 200 and 300 francs.", closing: "The sessions and my available budget were the same."}
    - {domain: public, context: "A museum charged 18 francs for an audio guide with the stated depth and coverage.", high: "Comparable guides at nearby museums with the same coverage cost more than 35 francs.", low: "Comparable guides at nearby museums with the same coverage were included in the entrance ticket.", closing: "The exhibits and visit length were the same."}

trust:
  ability:
    - {domain: work, context: "A statistician was assigned to check a complex sampling design.", high: "She identified every design error and correctly derived the required weights.", low: "She missed basic design errors and repeatedly derived the weights incorrectly.", closing: "Her honesty and motives were not discussed."}
    - {domain: personal, context: "An electrician examined a recurring malfunction in my home.", high: "He diagnosed the circuit correctly and completed the technical work without mistakes.", low: "He misunderstood the circuit and made several basic technical mistakes.", closing: "Nothing was said about whether he cared about my interests."}
    - {domain: public, context: "An engineer reviewed the load limits for a temporary footbridge.", high: "Her calculations were precise and she demonstrated extensive relevant expertise.", low: "Her calculations were repeatedly wrong and showed little relevant expertise.", closing: "Her candour and motives were not described."}
    - {domain: consumer, context: "A technician serviced the optical system in my camera.", high: "He handled the equipment expertly and calibrated every component correctly.", low: "He handled the equipment clumsily and calibrated several components incorrectly.", closing: "The price and interpersonal manner were unchanged."}
    - {domain: work, context: "A translator prepared a specialist legal document for our team.", high: "She understood the terminology and rendered every difficult passage accurately.", low: "She misunderstood the terminology and rendered difficult passages inaccurately.", closing: "No information was given about her honesty or goodwill."}
    - {domain: personal, context: "A guide planned a route through unfamiliar mountain terrain.", high: "He read the conditions accurately and demonstrated strong navigation skill.", low: "He misread the conditions and demonstrated poor navigation skill.", closing: "His concern for me was not described."}
  benevolence:
    - {domain: personal, context: "An adviser could recommend either of two equally competent services.", high: "She chose the one that best served my needs even though it gave her no personal benefit.", low: "She chose the one that benefited her most even though it worked against my needs.", closing: "Both options required the same expertise."}
    - {domain: public, context: "A caseworker had discretion over how to schedule my required appointment.", high: "He adjusted it to protect my interests despite receiving nothing from the change.", low: "He arranged it for his own convenience despite the avoidable cost to me.", closing: "The formal rules allowed either schedule."}
    - {domain: consumer, context: "A broker knew that two products would earn different commissions.", high: "She recommended the lower-commission product because it was better for me.", low: "She recommended the higher-commission product although it was worse for me.", closing: "She understood both products equally well."}
    - {domain: work, context: "My supervisor could allocate a desirable task in several acceptable ways.", high: "He considered my development needs even though doing so brought him no advantage.", low: "He used the allocation solely for his own advantage despite harming my development.", closing: "His authority and technical knowledge were unchanged."}
    - {domain: personal, context: "A neighbour held a spare key while I was travelling.", high: "She took extra steps to protect my interests without expecting anything in return.", low: "She used the situation to advance her own interests at my expense.", closing: "She was equally capable of managing the key."}
    - {domain: consumer, context: "A travel agent could select between two routes with the same reliability.", high: "He selected the route that best protected my time and needs despite earning less from it.", low: "He selected the route that increased his earnings despite creating avoidable problems for me.", closing: "His knowledge of both routes was identical."}
  integrity:
    - {domain: consumer, context: "A seller made a clear written promise about the condition of an item.", high: "The description was truthful, and the seller did exactly what had been promised.", low: "The description was deliberately misleading, and the seller broke the promise.", closing: "The seller's technical ability was not at issue."}
    - {domain: work, context: "A project lead committed to report all test outcomes to the team.", high: "She disclosed every result and followed the commitment consistently.", low: "She concealed inconvenient results and abandoned the commitment when it suited her.", closing: "Her competence and concern for me were not described."}
    - {domain: personal, context: "A caretaker agreed in writing to follow a specific arrangement while I was away.", high: "He kept the agreement and gave an accurate account of everything that occurred.", low: "He ignored the agreement and gave a false account of what occurred.", closing: "His practical skill was unchanged."}
    - {domain: public, context: "An organisation published rules for allocating a limited resource.", high: "It followed those stated rules consistently and reported the process honestly.", low: "It secretly departed from the stated rules and misrepresented the process.", closing: "Its administrative capacity was the same."}
    - {domain: consumer, context: "A repair service promised to replace only parts that had actually failed.", high: "It honoured that promise and accurately documented every replacement.", low: "It replaced unnecessary parts and falsified the explanation despite its promise.", closing: "The mechanics had the same level of skill."}
    - {domain: work, context: "A collaborator agreed to preserve the authorship record on a shared report.", high: "He kept the agreement and spoke truthfully about each person's contribution.", low: "He broke the agreement and knowingly misrepresented each person's contribution.", closing: "His ability to write the report was unchanged."}

fairness:
  distributive:
    - {domain: work, context: "Four researchers contributed different amounts to a completed data collection.", high: "My share of the credit matched the amount and quality of work I contributed.", low: "My share of the credit was far below the amount and quality of work I contributed.", closing: "The procedure and interpersonal manner were held constant."}
    - {domain: personal, context: "Several relatives divided the proceeds from property they had maintained together.", high: "My portion corresponded to the time and resources I had contributed.", low: "My portion bore no relation to the time and resources I had contributed.", closing: "The decision process was otherwise identical."}
    - {domain: public, context: "Volunteers received access passes after completing different numbers of shifts.", high: "The pass I received corresponded to the shifts and responsibilities I completed.", low: "The pass I received was much less than my shifts and responsibilities warranted.", closing: "Everyone was spoken to in the same manner."}
    - {domain: consumer, context: "Members of a cooperative received annual rebates based on their purchases.", high: "My rebate accurately reflected the purchases I had made.", low: "My rebate was much smaller than my purchases warranted.", closing: "The calculation procedure was explained in the same way."}
    - {domain: work, context: "A bonus pool was divided after a team completed a difficult delivery.", high: "My bonus matched my documented contribution to the delivery.", low: "My bonus did not match and substantially undervalued my documented contribution.", closing: "The rules and treatment during the meeting were constant."}
    - {domain: personal, context: "Housemates divided a deposit refund after paying unequal repair costs.", high: "The amount returned to me matched what I had paid and repaired.", low: "The amount returned to me ignored what I had paid and repaired.", closing: "The discussion followed the same format."}
  procedural:
    - {domain: public, context: "A committee evaluated applications for a limited community grant.", high: "It used the same published criteria for everyone, checked conflicts, and allowed me to respond to concerns.", low: "It changed criteria between applicants, ignored conflicts, and gave me no chance to respond.", closing: "My final outcome was the same in both versions."}
    - {domain: consumer, context: "An airline reviewed requests for compensation after a disruption.", high: "It applied a consistent rule, used an independent reviewer, and let me submit relevant evidence.", low: "It applied shifting rules, used a biased reviewer, and refused to consider my evidence.", closing: "The compensation amount was held constant."}
    - {domain: work, context: "A promotion panel assessed several employees for one position.", high: "The panel followed consistent criteria, managed conflicts, and gave each person an opportunity to be heard.", low: "The panel used arbitrary criteria, allowed conflicts, and prevented me from being heard.", closing: "The selected candidate was unchanged."}
    - {domain: personal, context: "A club reviewed a complaint about use of its shared equipment.", high: "It followed its established rule, used neutral decision makers, and invited my account before deciding.", low: "It invented a rule afterward, used involved decision makers, and decided without hearing my account.", closing: "The practical consequence was the same."}
    - {domain: public, context: "A licensing office reconsidered my submitted documentation.", high: "It used the same standards as other cases, checked the evidence impartially, and permitted an appeal.", low: "It used different standards for my case, assessed the evidence with bias, and blocked any appeal.", closing: "The initial result did not change."}
    - {domain: consumer, context: "A platform reviewed a disputed transaction on my account.", high: "It applied a stable policy, assigned an uninvolved reviewer, and considered information from both sides.", low: "It applied an improvised policy, assigned a conflicted reviewer, and ignored information from my side.", closing: "The transaction value was identical."}
  interpersonal:
    - {domain: personal, context: "A housing coordinator explained a routine inspection result to me.", high: "She spoke with courtesy, preserved my dignity, and treated me as a person worthy of respect.", low: "She mocked me, spoke in a demeaning way, and treated me without basic respect.", closing: "The result and procedure were unchanged."}
    - {domain: public, context: "An official discussed my place in a standard registration queue.", high: "He addressed me politely and protected my dignity throughout the conversation.", low: "He addressed me contemptuously and humiliated me during the conversation.", closing: "My place in the queue stayed the same."}
    - {domain: consumer, context: "A service manager told me that a requested option was unavailable.", high: "She communicated the decision respectfully and without belittling me.", low: "She communicated the decision with insults and deliberately belittled me.", closing: "The decision and explanation were otherwise identical."}
    - {domain: work, context: "A supervisor gave feedback on a routine draft.", high: "He treated me with dignity and expressed every criticism in a respectful manner.", low: "He demeaned me personally and expressed the criticism in a humiliating manner.", closing: "The substantive criticism was the same."}
    - {domain: personal, context: "A committee member informed me that my booking had to move.", high: "She spoke considerately and treated my concerns with basic respect.", low: "She ridiculed my concerns and spoke to me as though I were beneath consideration.", closing: "The new booking time was identical."}
    - {domain: public, context: "A staff member checked my ticket at the entrance to a public event.", high: "He interacted with me courteously and respected my dignity.", low: "He interacted with me abusively and tried to embarrass me in front of others.", closing: "The ticket was accepted in both versions."}
